name: DriftGuard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driftguard:
    name: Test and Detect Configuration Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Check configuration drift (CLI)
        run: npm run cli

      - name: Upload DriftGuard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-reports
          path: reports/
          if-no-files-found: warn
