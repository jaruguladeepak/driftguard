name: DriftGuard PR Policy Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "config/**"
      - "src/core/**"
      - "src/cli.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/driftguard-pr-gate.yml"
  workflow_dispatch:
    inputs:
      actual_config:
        description: "Configuration file to evaluate"
        required: true
        type: choice
        default: config/actual.yaml
        options:
          - config/actual.yaml
          - config/demo-actual.yaml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: driftguard-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate Configuration Policy
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.evaluate.outputs.blocked }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Evaluate configuration drift
        id: evaluate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          ACTUAL_CONFIG_INPUT: ${{ inputs.actual_config || 'config/actual.yaml' }}
        run: |
          set -euo pipefail

          EXPECTED_CONFIG="config/expected.yaml"
          ACTUAL_CONFIG="config/actual.yaml"
          BASELINE_CHANGED="false"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Use the trusted baseline from the target branch,
            # not a baseline modified by the proposed pull request.
            git show "origin/${BASE_REF}:config/expected.yaml" > "$RUNNER_TEMP/driftguard-expected.yaml"
            EXPECTED_CONFIG="$RUNNER_TEMP/driftguard-expected.yaml"

            # Changes to the trusted baseline require separate review.
            if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Fxq "config/expected.yaml"; then
              BASELINE_CHANGED="true"
            fi
          else
            ACTUAL_CONFIG="$ACTUAL_CONFIG_INPUT"
          fi

          # Validate the selected configuration path.
          case "$ACTUAL_CONFIG" in
            config/actual.yaml|config/demo-actual.yaml) ;;
            *) echo "::error::Unsupported configuration path"
               exit 2 ;;
          esac

          echo "Expected configuration: $EXPECTED_CONFIG"
          echo "Actual configuration: $ACTUAL_CONFIG"

          # The CLI deliberately exits nonzero for critical drift.
          # Capture that result so the report can still be published
          # before the separate policy-gate job fails.
          set +e
          npm run cli -- --expected "$EXPECTED_CONFIG" --actual "$ACTUAL_CONFIG"
          CLI_EXIT_CODE=$?
          set -e

          BLOCKED="false"
          if [ "$CLI_EXIT_CODE" -ne 0 ]; then
            BLOCKED="true"
          fi

          if [ "$BASELINE_CHANGED" = "true" ]; then
            BLOCKED="true"
          fi

          mkdir -p reports

          # Produce a useful report even if configuration parsing fails.
          if [ ! -f reports/drift-report.md ]; then
            cat > reports/drift-report.md <<'REPORT'
          # DriftGuard Configuration Drift Report

          **Status:** BLOCKED

          The configuration analysis did not complete successfully. Inspect the workflow logs for the underlying error.
          REPORT
          fi

          # Add the decision and baseline-protection explanation.
          {
            if [ "$BLOCKED" = "true" ]; then
              echo "## 🚨 DriftGuard: BLOCKED"
            else
              echo "## ✅ DriftGuard: PASSED"
            fi
            echo
            if [ "$BASELINE_CHANGED" = "true" ]; then
              echo "### Trusted baseline modification detected"
              echo
              echo "Changes to \`config/expected.yaml\` require separate review."
              echo "The policy check used the baseline from the target branch."
              echo
            fi
            cat reports/drift-report.md
          } > "$RUNNER_TEMP/driftguard-report.md"

          cp "$RUNNER_TEMP/driftguard-report.md" reports/drift-report.md

          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
          echo "CLI exit code: $CLI_EXIT_CODE"
          echo "Policy decision: $BLOCKED"

      - name: Upload DriftGuard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-pr-report
          path: reports/drift-report.md
          if-no-files-found: ignore
          retention-days: 14

  driftguard-policy-gate:
    name: DriftGuard Policy Gate
    runs-on: ubuntu-latest
    needs: evaluate
    if: always()
    steps:
      - name: Enforce policy decision
        shell: bash
        env:
          EVALUATION_RESULT: ${{ needs.evaluate.result }}
          BLOCKED: ${{ needs.evaluate.outputs.blocked }}
        run: |
          if [ "$EVALUATION_RESULT" != "success" ]; then
            echo "::error::Policy evaluation failed. Blocking the release."
            exit 1
          fi

          if [ "$BLOCKED" = "true" ]; then
            echo "::error::Critical drift or a baseline modification was detected."
            echo "::error::Resolve the issue before merging."
            exit 1
          fi

          echo "DriftGuard passed. No critical drift detected."

  pr-comment:
    name: Publish PR Report
    runs-on: ubuntu-latest
    needs:
      - evaluate
      - driftguard-policy-gate
    if: always() && github.event_name == 'pull_request'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Download DriftGuard report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: driftguard-pr-report
          path: reports

      - name: Create or update PR comment
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          EVALUATION_RESULT: ${{ needs.evaluate.result }}
          BLOCKED: ${{ needs.evaluate.outputs.blocked }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- driftguard-policy-gate -->";
            const reportPath = "reports/drift-report.md";
            const evaluationFailed = process.env.EVALUATION_RESULT !== "success";
            const blocked = evaluationFailed || process.env.BLOCKED === "true";

            let report;
            if (fs.existsSync(reportPath)) {
              report = fs.readFileSync(reportPath, "utf8");
            } else {
              report = "The policy evaluation did not produce a report. " +
                "Inspect the failed workflow steps for details.";
            }

            const heading = blocked
              ? "## 🚨 DriftGuard: BLOCKED"
              : "## ✅ DriftGuard: PASSED";

            const body = [
              marker,
              heading,
              "",
              blocked
                ? "This pull request did not pass the DriftGuard policy gate."
                : "This pull request passed the DriftGuard policy gate.",
              "",
              report,
              "",
              "---",
              "Generated automatically by DriftGuard."
            ].join("\n");

            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              }
            );

            const existing = comments.find(
              comment => comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              core.info("Updated existing DriftGuard comment.");
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
              core.info("Created DriftGuard comment.");
            }

  deploy-staging:
    name: Simulate Staging Deployment
    runs-on: ubuntu-latest
    needs:
      - evaluate
      - driftguard-policy-gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.driftguard-policy-gate.result == 'success'
    steps:
      - name: Deploy to staging simulation
        run: |
          echo "DriftGuard policy gate passed."
          echo "Simulating deployment to staging..."
          echo "Staging deployment simulation completed."

  deploy-production:
    name: Simulate Production Deployment
    runs-on: ubuntu-latest
    needs:
      - evaluate
      - driftguard-policy-gate
      - deploy-staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.driftguard-policy-gate.result == 'success' &&
      needs.deploy-staging.result == 'success'
    steps:
      - name: Production release gate
        run: |
          echo "DriftGuard policy gate passed."
          echo "Staging simulation succeeded."
          echo "Production deployment simulation allowed."

